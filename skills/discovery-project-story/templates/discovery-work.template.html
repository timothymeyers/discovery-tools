<script>
"use strict";
(() => {
const D = JSON.parse(document.getElementById("story-data").textContent);
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const S = {scene: 0, beat: 0, t: 0, playing: false, phase: "settled", gen: 0, gapLeft: 0,
           reduced: matchMedia("(prefers-reduced-motion: reduce)").matches};
const W = {routes: [], dots: [], cards: {}, nodes: {}, edges: {}, bars: []};

function el(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== undefined && v !== null) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function html(tag, attrs, parent, text) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const clear = e => { while (e.firstChild) e.removeChild(e.firstChild); };
const show = (e, on) => e.toggleAttribute("hidden", !on);
const scene = () => D.scenes[S.scene];
const beat = () => scene().beats[S.beat];
const dur = () => beat().animationMs;

/* Fit text into maxLines lines within maxW, shrinking font down to minSize. */
function fitText(t, str, x, y, lineH, maxW, maxLines, size, minSize) {
  for (let fs = size; fs >= minSize; fs -= 1) {
    clear(t); t.setAttribute("font-size", fs); t.style.fontSize = fs + "px";
    const words = String(str || "").split(/\s+/).filter(Boolean);
    let lines = [], cur = "";
    const span = el("tspan", {x, y}, t);
    const width = s => { span.textContent = s; return span.getComputedTextLength(); };
    for (const w of words) {
      const next = cur ? cur + " " + w : w;
      if (width(next) <= maxW || !cur) cur = next; else { lines.push(cur); cur = w; }
    }
    if (cur) lines.push(cur);
    t.removeChild(span);
    const ok = lines.length <= maxLines && lines.every(l => width2(t, l, x, y) <= maxW);
    if (ok || fs === minSize) {
      if (!ok) { lines = lines.slice(0, maxLines); t.dataset.overflow = "1"; } else delete t.dataset.overflow;
      const lh = lineH * fs / size;
      lines.forEach((l, i) => el("tspan", {x, y: y + i * lh}, t, l));
      return lines.length;
    }
  }
}
function width2(t, s, x, y) { const sp = el("tspan", {x, y}, t, s); const w = sp.getComputedTextLength(); t.removeChild(sp); return w; }

/* ── icons ── */
function icon(role, x, y, g) {
  const c = {human: "icon", discovery: "icon discovery", record: "icon record"}[role] || "icon";
  const p = {
    human: "M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 22c0-4.4 3.6-8 8-8s8 3.6 8 8",
    discovery: "M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5 9.8 12.2 3.5 10l6.3-1.7zM19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9z",
    record: "M6 2h9l5 5v15H6zM15 2v5h5M9 12h8M9 16h8"}[role] || "M4 4h16v16H4z";
  el("path", {d: p, class: c, transform: `translate(${x} ${y})`}, g);
}

/* ── geometry ── */
function branchLayout(n) {
  const top = 30, span = 686, h = Math.min(110, (span - (n - 1) * 16) / n);
  const gap = n > 1 ? Math.min(108, (span - n * h) / (n - 1)) : 0;
  const total = n * h + (n - 1) * gap, start = top + (span - total) / 2;
  return Array.from({length: n}, (_, i) => ({y: start + i * (h + gap), h}));
}
const CARD = {w: 330, h: 106};
const cardXY = c => ({x: 580 + (c.col || 0) * 420, y: [140, 350, 560][c.row || 0]});
function routePath(a, b, loop) {
  const A = cardXY(a), B = cardXY(b);
  if (loop) {
    const ax = A.x + CARD.w / 2, ay = A.y + CARD.h, bx = B.x + CARD.w / 2, by = B.y + CARD.h;
    const d = Math.max(ay, by) + 34;
    return `M${ax} ${ay} C${ax} ${d} ${bx} ${d} ${bx} ${by}`;
  }
  if ((a.row || 0) === (b.row || 0)) {
    const r = B.x > A.x;
    const x1 = r ? A.x + CARD.w : A.x, x2 = r ? B.x : B.x + CARD.w, y = A.y + CARD.h / 2;
    return `M${x1} ${y} L${x2} ${y}`;
  }
  if ((a.col || 0) === (b.col || 0)) {
    const down = B.y > A.y, x = A.x + CARD.w / 2;
    return `M${x} ${down ? A.y + CARD.h : A.y} L${x} ${down ? B.y : B.y + CARD.h}`;
  }

  html("p", {}, body, D.subtitle || "");

  if ((A.caveats || []).length) { html("h3", {}, body, "Read with care"); const ul = html("ul", {}, body); A.caveats.forEach(c => html("li", {}, ul, c)); }
  html("h3", {}, body, "Build"); html("pre", {class: "mono"}, body, JSON.stringify(D.build, null, 1));
  html("h3", {}, body, "Controls"); html("p", {}, body, "← / → beat · PageUp / PageDown scene · Space play beat · P play scene · N notes · E exact exchange · Esc close. Link to a beat with #s=2&b=3; force a theme with ?theme=light or ?theme=dark.");
  openDialog("d-about");
}

/* ── wiring ── */
D.scenes.forEach((s, i) => html("option", {value: String(i)}, $("scene-select"), `${i + 1}. ${s.title}`));
$("story-title").textContent = D.title; $("story-sub").textContent = D.subtitle || "";
$("planned").textContent = `${D.minutes} min spoken plan`;
$("scene-select").addEventListener("change", e => jump(+e.target.value, 0));
$("prev").addEventListener("click", () => stepBeat(-1)); $("next").addEventListener("click", () => stepBeat(1));
$("prev-scene").addEventListener("click", () => jump(S.scene - 1, 0)); $("next-scene").addEventListener("click", () => jump(S.scene + 1, 0));
$("play-beat").addEventListener("click", () => run(false));
$("play-scene").addEventListener("click", () => S.playing ? stop() : run(true));
$("scrub").addEventListener("input", e => seek(dur() * (+e.target.value) / 1000));
$("reduced").checked = S.reduced; $("reduced").addEventListener("change", e => { S.reduced = e.target.checked; renderTime(); });
$("theme").addEventListener("click", () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; });
$("exchange-open").addEventListener("click", openExchange); $("exchange-select").addEventListener("change", e => renderExchange(e.target.value));
$("artifact-open").addEventListener("click", openArtifact); $("notes-open").addEventListener("click", openNotes);
$("chron-open").addEventListener("click", openChron); $("about-open").addEventListener("click", openAbout);
document.querySelectorAll("dialog [data-close]").forEach(b => b.addEventListener("click", () => b.closest("dialog").close()));
document.addEventListener("keydown", e => {
  if (document.querySelector("dialog[open]") || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== "range") return;
  const k = e.key;
  if (k === "ArrowRight") { e.preventDefault(); stepBeat(1); } else if (k === "ArrowLeft") { e.preventDefault(); stepBeat(-1); }
  else if (k === "PageDown") { e.preventDefault(); jump(S.scene + 1, 0); } else if (k === "PageUp") { e.preventDefault(); jump(S.scene - 1, 0); }
  else if (k === " ") { e.preventDefault(); S.playing ? stop() : run(false); } else if (k === "p" || k === "P") { S.playing ? stop() : run(true); }
  else if (k === "n" || k === "N") openNotes(); else if ((k === "e" || k === "E") && beat().human && beat().human.quoteId) openExchange();
});
const m = /s=(\d+)&b=(\d+)/.exec(location.hash);
S.scene = m ? Math.max(0, Math.min(D.scenes.length - 1, +m[1] - 1)) : 0;
S.beat = m ? Math.max(0, Math.min(scene().beats.length - 1, +m[2] - 1)) : 0;
S.t = dur();
W.staticScene = -1;
renderAll();
window.STORY = {data: D, jump, seek, stop, playBeat: () => run(false), playScene: () => run(true),
  state: () => ({scene: S.scene, beat: S.beat, t: S.t, playing: S.playing, phase: S.phase, reduced: S.reduced})};
})();
</script>
